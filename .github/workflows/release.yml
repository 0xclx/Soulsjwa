# Release workflow — builds and publishes the API Docker image to GitHub
# Container Registry (GHCR) on every push to `main` and on `v*` tags.
#
# Currently DISABLED. The repository is private and not yet running against a
# real deployment target. Once the repo is recreated as public (or a paid
# GHCR plan is in place) and a host is wired up to pull from `ghcr.io`,
# uncomment the contents below and the workflow will start producing tagged
# images at `ghcr.io/<owner>/soulsjwa-api`.
#
# Tags produced per build (via docker/metadata-action):
#   - sha-<full-sha>   ← pin this in docker-compose.yml for prod
#   - <branch>         ← e.g. `main` for staging auto-pull
#   - <semver>         ← e.g. `1.2.3` from a `v1.2.3` git tag
#   - latest           ← only on the default branch
#
# Once enabled, switch `docker-compose.yml` from `build: .` to:
#   image: ghcr.io/${{ github.repository_owner }}/soulsjwa-api:sha-<sha>
# on both the `migrate` and `api` services (must be the same tag).
#
# To re-enable: remove the leading `# ` from every line below this banner.

