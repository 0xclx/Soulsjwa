# Release workflow — builds and publishes the API Docker image to GitHub
# Container Registry (GHCR) on every push to `main` and on `v*` tags.
#
# Publishes to `ghcr.io/<owner>/soulsjwa-api`.
#
# Tags produced per build (via docker/metadata-action):
#   - sha-<full-sha>   ← pin this in docker-compose.prod.yml for prod
#   - <branch>         ← e.g. `main` for staging auto-pull
#   - <semver>         ← e.g. `1.2.3` from a `v1.2.3` git tag
#   - latest           ← only on the default branch

name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # required to push to GHCR

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/soulsjwa-api
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
