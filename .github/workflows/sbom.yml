name: SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom:
    name: Generate source SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Anchore Syft scans the working directory and emits a CycloneDX + SPDX SBOM
      # describing every detected dependency across all ecosystems present in the
      # repo (NuGet, npm, GitHub Actions, Docker base images).
      - name: Generate SBOM (Syft)
        id: syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error
