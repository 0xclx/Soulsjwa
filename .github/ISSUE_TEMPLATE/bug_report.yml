name: Bug report
description: Report something that is broken or behaving unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in as much as you can.

        **Do not file security vulnerabilities here.** See [SECURITY.md](../SECURITY.md)
        for the private disclosure process.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal step-by-step reproduction.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages, stack traces, and `traceId` from the JSON error body if available.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      multiple: true
      options:
        - Backend (Soulsjwa.Api)
        - Frontend (Soulsjwa.Web)
        - Connector (Soulsjwa.Connector)
        - Docs
        - CI / Build / Docker
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit SHA
      description: What version or commit are you running?
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, .NET runtime, etc. as relevant.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, logs, anything else that helps.
