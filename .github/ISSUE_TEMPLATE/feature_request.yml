name: Feature request
description: Suggest a new feature or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe what you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem is this feature solving? Who is the user?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the feature look like? Mock-ups, API shapes, anything concrete helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you'd prefer the one above.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Backend (Soulsjwa.Api)
        - Frontend (Soulsjwa.Web)
        - Connector (Soulsjwa.Connector)
        - Docs
        - CI / Build / Docker
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
